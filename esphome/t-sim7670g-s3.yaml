# LILYGO T-SIM7670G-S3 — ESP32-S3 (N16R8) + SIM7670G LTE
#
# The ESP32-S3 dials the SIM7670G's cellular (LTE) data link over its UART as
# PPP, using the microlink's built-in SIM7670G driver. That PPP netif is the
# primary uplink: Tailscale (microlink) joins the tailnet over it, and Home
# Assistant reaches the device at its 100.x.y.z address. The SIM7670G has NO
# Wi-Fi, so the ESP32-S3's own Wi-Fi radio is a separate, optional fallback
# uplink — used when there is no SIM.
#
# See ../README.md for the full setup guide.

esphome:
  name: t-sim7670g-s3
  friendly_name: T-SIM7670G-S3

esp32:
  board: esp32-s3-devkitc1-n16r8
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
      CONFIG_LWIP_TCPIP_CORE_LOCKING: n
  flash_size: 16MB

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source:
      type: git
      url: https://github.com/eddietheengineer/esphome-tailscale
      ref: feat/sim7670g-cellular-uplink
      path: components
    refresh: "1h"
    components:
      - tailscale
  - source:
      type: git
      url: https://github.com/eddietheengineer/esphome-lilygo
      ref: main
      path: components
    refresh: "1h"
    components:
      - sim7670g

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret tailscale_ip

tailscale:
  auth_key: !secret tailscale_auth_key
  hostname: "t-sim7670g-s3"
  max_peers: 1
  priority_peer: !secret priority_peer_ip
  cellular:
    enabled: true
    apn: !secret modem_apn
    sim_pin: !secret modem_sim_pin
    ppp_user: !secret modem_ppp_user
    ppp_pass: !secret modem_ppp_pass
    tx_pin: 4
    rx_pin: 5
    pwrkey_pin: 46
    dtr_pin: 7

sim7670g:
  battery_adc: 8
  voltage_divider: 2.0
  update_interval: 30s

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

logger:
  level: INFO
  baud_rate: 921600

binary_sensor:
  - platform: tailscale
    connected:
      name: "VPN Connected"
      icon: mdi:shield-check

text_sensor:
  - platform: tailscale
    ip_address:
      name: "VPN IP"
      icon: mdi:ip-network

button:
  - platform: tailscale
    reconnect:
      name: "VPN Reconnect"
      icon: mdi:connection
  - platform: restart
    name: "Reboot"

sensor:
  - platform: sim7670g
    battery_voltage:
      name: "Battery Voltage"

switch:
  - platform: tailscale
    vpn_enabled:
      name: "VPN Enabled"
      icon: mdi:vpn
