# Mosquitto broker for the T-SIM7670G-S3 MQTT uplink.
#
# Listens on:
# 1883 - plaintext, bound to 127.0.0.1 in docker-compose.yml (same-VPS HA
#       only — NOT reachable from the internet)
# 8883 - TLS, public (the device on cellular connects here)
#
# The device (on cellular) connects OUTBOUND to this broker; Home Assistant
# also connects here (as a subscriber) so it receives the device's data.

listener 1883
protocol mqtt

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Auth: username/password (see password.txt, generated by gen-certs.sh) +
# per-user topic ACLs (see acl.conf).
allow_anonymous false
password_file /mosquitto/config/password.txt
acl_file /mosquitto/config/acl.conf

# Cap connections (device + HA + margin) — this broker is internet-exposed.
max_connections 10

# Retain messages + persist across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
