# Per-user topic ACLs for the T-SIM7670G-S3 MQTT uplink.
#
# Two users (created by gen-certs.sh):
#   esphome       - the device (publishes sensor state + HA discovery)
#   homeassistant - Home Assistant's MQTT integration (reads state, sends
#                   commands such as the on-demand Tailscale switch)
#
# The device's ESPHome topic prefix is its name: t-sim7670g-s3-mqtt.

# Device: read/write its own topic tree; write the HA discovery namespace
# (ESPHome auto-discovery publishes config to homeassistant/<type>/<id>/config).
user esphome
topic read t-sim7670g-s3-mqtt/#
topic write t-sim7670g-s3-mqtt/#
topic write homeassistant/#

# Home Assistant: read everything; write the device's command topics
# (e.g. t-sim7670g-s3-mqtt/vpn_enabled/set).
user homeassistant
topic read #
topic write t-sim7670g-s3-mqtt/#
